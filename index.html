<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D285A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ORGANIZADO$">
<meta name="description" content="Finanzas personales: registra gastos, mira tus gráficos y controla presupuesto y deudas. Tus datos se guardan en tu propio navegador.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231D285A'/%3E%3Ctext x='32' y='47' font-family='Arial' font-weight='900' font-size='42' text-anchor='middle' fill='%23E9BC55'%3E$%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231D285A'/%3E%3Ctext x='32' y='47' font-family='Arial' font-weight='900' font-size='42' text-anchor='middle' fill='%23E9BC55'%3E$%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ORGANIZADO$</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: una sola columna de teléfono (máx. 480px), barra superior fija, barra de pestañas inferior con botón + central, tarjeta tipo billete como portada */
:root{
  --bg:#EDEFF4; --surface:#FFFFFF; --surface-2:#E4E7EF; --ink:#151B2E; --muted:#596077; --faint:#8A90A2; --line:#D9DDE6;
  --brand:#25336F; --on-brand:#FFFFFF; --brand-soft:#DDE2F5; --gold:#9A6B10; --gold-soft:#F4E8CC;
  --pos:#127A4B; --neg:#BF3D36; --warn:#9A6200; --pos-soft:#DCF1E6; --neg-soft:#F8E0DE; --warn-soft:#F7EACB;
  --hero-a:#1D285A; --hero-b:#33448F; --hero-ink:#F5F2E9; --hero-mut:#C5CAE6; --hero-gold:#E9BC55;
  --ico-bg-l:91%; --ico-fg-l:30%; --ico-s:42%;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s-other:#A4A9B6;
  --grid:#E6E8EE; --axis:#C3C7D1;
  --f-display:'Bricolage Grotesque','Manrope',system-ui,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --shadow:0 1px 2px rgba(20,27,46,.05),0 6px 18px rgba(20,27,46,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0F17; --surface:#161A25; --surface-2:#212635; --ink:#ECEEF4; --muted:#A3A9BA; --faint:#757C8F; --line:#2A3040;
    --brand:#93A2F2; --on-brand:#0C0F17; --brand-soft:#252D4D; --gold:#E2B252; --gold-soft:#3A2F17;
    --pos:#43C68C; --neg:#F27A70; --warn:#E9AE3B; --pos-soft:#15332A; --neg-soft:#3A1F1F; --warn-soft:#3A2E14;
    --hero-a:#18204A; --hero-b:#2B3B84; --hero-ink:#F5F2E9; --hero-mut:#B9BFE0; --hero-gold:#EDC264;
    --ico-bg-l:22%; --ico-fg-l:80%; --ico-s:35%;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s-other:#5E6474;
    --grid:#232837; --axis:#3A4051;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0F17; --surface:#161A25; --surface-2:#212635; --ink:#ECEEF4; --muted:#A3A9BA; --faint:#757C8F; --line:#2A3040;
  --brand:#93A2F2; --on-brand:#0C0F17; --brand-soft:#252D4D; --gold:#E2B252; --gold-soft:#3A2F17;
  --pos:#43C68C; --neg:#F27A70; --warn:#E9AE3B; --pos-soft:#15332A; --neg-soft:#3A1F1F; --warn-soft:#3A2E14;
  --hero-a:#18204A; --hero-b:#2B3B84; --hero-ink:#F5F2E9; --hero-mut:#B9BFE0; --hero-gold:#EDC264;
  --ico-bg-l:22%; --ico-fg-l:80%; --ico-s:35%;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s-other:#5E6474;
  --grid:#232837; --axis:#3A4051;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 112px;min-height:100%}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;margin-inline:-16px;padding-inline:16px}
.logo{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1}
.logo b{color:var(--gold);font-weight:800}
.back{display:flex;align-items:center;gap:6px;font-weight:700;font-size:17px}
.back svg{width:22px;height:22px}
.top-sub{font-size:12px;color:var(--muted);font-weight:600}

/* Banner */
.banner{background:var(--gold-soft);border-radius:var(--r-md);padding:12px 14px;margin-block:4px 14px;display:grid;gap:10px;font-size:13.5px}
.banner p{margin:0}
.banner .row{display:flex;gap:8px;flex-wrap:wrap}
.banner.warn{background:var(--neg-soft)}

/* Hero (billete) */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:20px 20px 16px;color:var(--hero-ink);background:linear-gradient(135deg,var(--hero-a),var(--hero-b));isolation:isolate}
.hero::before{content:"";position:absolute;inset:-40%;z-index:-1;opacity:.13;background:repeating-radial-gradient(circle at 85% 20%,transparent 0 9px,var(--hero-gold) 9px 10px)}
.hero::after{content:"$";position:absolute;right:14px;bottom:-34px;font-family:var(--f-display);font-weight:800;font-size:150px;line-height:1;color:var(--hero-gold);opacity:.13;z-index:-1}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.hero .eyebrow{color:var(--hero-mut)}
.hero-month{font-size:12.5px;color:var(--hero-mut);font-weight:600}
.hero-num{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,9.5vw,40px);letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.hero-spark{height:54px;margin:8px -4px 6px}
.hero-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid rgba(255,255,255,.16);padding-top:12px}
.hero-flow span{display:block;font-size:11.5px;color:var(--hero-mut);font-weight:600}
.hero-flow b{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}

/* Sections */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-block:24px 10px}
.sec-h h2,.h2{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.link{color:var(--brand);font-weight:700;font-size:13.5px}
.card{background:var(--surface);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.card h3{font-family:var(--f-display);font-size:16px;font-weight:700;margin:0 0 2px}
.card .sub{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.stack{display:grid;gap:12px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .neu{color:var(--muted)}

/* Accounts carousel */
.cards-x{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none}
.cards-x::-webkit-scrollbar{display:none}
.acct{flex:0 0 152px;scroll-snap-align:start;height:96px;border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#fff;background:var(--acc);position:relative;overflow:hidden}
.acct::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.12)}
.acct-name{font-size:13px;font-weight:700;opacity:.92}
.acct-bal{font-family:var(--f-display);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.acct.add{background:transparent;color:var(--brand);border:1.5px dashed var(--line);align-items:center;justify-content:center;font-weight:700}
.acct.add::after{display:none}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border-radius:var(--r-sm);padding:11px 12px;box-shadow:var(--shadow);min-width:0}
.kpi span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Movement rows */
.list{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.mov{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--line)}
.mov:first-child{border-top:0}
.mov:active{background:var(--surface-2)}
.ico{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:12.5px;letter-spacing:.02em;background:hsl(var(--h) var(--ico-s) var(--ico-bg-l));color:hsl(var(--h) 55% var(--ico-fg-l))}
.mov-main{flex:1;min-width:0;display:grid}
.mov-t{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov-s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov-a{font-weight:800;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-style:normal;font-weight:700;font-size:11px;padding:1px 6px;border-radius:6px}
.tag.lujo{background:var(--gold-soft);color:var(--gold)}
.tag.nec{background:var(--brand-soft);color:var(--brand)}
.day-h{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);padding:16px 4px 6px;text-transform:capitalize}
.empty{text-align:center;color:var(--muted);padding:28px 16px;font-size:14px}

/* Controls */
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.monthnav b{text-transform:capitalize;font-size:14.5px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--surface-2)}
.iconbtn svg{width:20px;height:20px}
.iconbtn:disabled{opacity:.3}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.field{display:grid;gap:6px}
.field > span{font-size:12.5px;font-weight:700;color:var(--muted)}
.inp{width:100%;background:var(--surface-2);border:1.5px solid transparent;border-radius:var(--r-sm);padding:11px 12px;font-size:16px}
.inp:focus{outline:none;border-color:var(--brand)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r-sm);padding:0 12px;box-shadow:var(--shadow)}
.search svg{width:18px;height:18px;color:var(--muted);flex:0 0 auto}
.search input{flex:1;border:0;background:none;padding:11px 0;font-size:16px;min-width:0}
.search input:focus{outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;font-weight:800;font-size:15px;background:var(--brand);color:var(--on-brand)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--neg);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Bars */
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex;gap:2px}
.bar i{display:block;height:100%;border-radius:99px}
.prow{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.prow:first-child{border-top:0;padding-top:0}
.prow-top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.prow-top b{font-weight:700}
.status{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:6px}
.status.ok{background:var(--pos-soft);color:var(--pos)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.over{background:var(--neg-soft);color:var(--neg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Charts */
.chart{position:relative;height:220px}
.chart.tall{height:260px}
.donut-wrap{position:relative;height:210px}
.donut-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-center span{font-size:12px;color:var(--muted);font-weight:600}
.donut-center b{font-family:var(--f-display);font-size:20px;font-weight:700}
.catlist{display:grid;margin-top:12px}
.catrow{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);text-align:left;width:100%;font-size:14px}
.catrow:first-child{border-top:0}
.catrow i{width:12px;height:12px;border-radius:4px}
.catrow .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.catrow .r small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
.nochart{display:grid;place-items:center;height:100%;color:var(--muted);font-size:13px;text-align:center}

/* Matrix */
.mx-wrap{overflow-x:auto;margin-inline:-16px;padding-inline:16px}
.mx{border-collapse:separate;border-spacing:2px;font-size:12px;font-variant-numeric:tabular-nums}
.mx th{font-weight:700;color:var(--muted);padding:4px 6px;text-align:right;white-space:nowrap;text-transform:capitalize}
.mx th:first-child,.mx td:first-child{position:sticky;left:0;background:var(--surface);text-align:left;z-index:1;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.mx td{padding:6px 7px;text-align:right;border-radius:5px;white-space:nowrap;position:relative}
.mx td.c{background:color-mix(in srgb,var(--s1) calc(var(--a) * 100%),var(--surface))}
.mx td.c.hi{color:#fff}

/* Alertas de pago */
.alerts{border-left:0}
.alert-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.alert-row:first-of-type{border-top:0}
.alert-row .status{grid-column:1/-1;justify-self:start}
.alert-main{min-width:0;display:grid}
.alert-main b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert-main small{font-size:12.5px;color:var(--muted)}
.tab{position:relative}
.dot{position:absolute;top:6px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--neg);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;line-height:1}
.abono{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--line)}
.abono:first-child{border-top:0}
.abono:active{background:var(--surface-2)}
.abono .edit{font-size:12px;font-weight:700;color:var(--brand)}

/* Patrimonio + nómina */
.hist-wrap{overflow-x:auto}
.hist{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.hist th{font-size:11.5px;font-weight:700;color:var(--muted);text-align:right;padding:8px 16px 6px;white-space:nowrap}
.hist td{text-align:right;padding:8px 16px;border-top:1px solid var(--line);white-space:nowrap}
.hist th:first-child,.hist td:first-child{text-align:left;text-transform:capitalize}
.priv .amt{filter:blur(8px);user-select:none}
.priv canvas{filter:blur(6px)}
.hx{display:grid}
.hx-row{display:grid;grid-template-columns:1fr 64px;grid-template-areas:"l i" "l v";gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.hx-row:first-child{border-top:0}
.hx-l{grid-area:l;display:grid;min-width:0}
.hx-l b{font-size:14px}
.hx-l small{font-size:12px;color:var(--muted)}
.hx-l .hx-p{color:var(--brand);font-weight:700}
.hx-in{grid-area:i;text-align:center;padding:9px 6px}
.hx-v{grid-area:v;text-align:center;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:" ▾";color:var(--muted)}
details[open] summary::after{content:" ▴"}
.top .right{display:flex;align-items:center;gap:4px}

/* Saludo y personalización */
.hello{margin:2px 0 14px}
.hello h1{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.015em;margin:0;line-height:1.15;text-wrap:balance}
.hello p{margin:3px 0 0;color:var(--muted);font-size:13.5px;font-weight:600}
.emo{display:inline-block;transform-origin:70% 80%;animation:wave 1.6s ease-in-out .3s 1}
@keyframes wave{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-10deg)}45%{transform:rotate(12deg)}60%{transform:rotate(-6deg)}}
@media (prefers-reduced-motion: reduce){.emo{animation:none}}
.hero.has-img::before{opacity:.06}
.hero.has-img .hero-num,.hero.has-img .hero-flow b{text-shadow:0 1px 8px rgba(0,0,0,.35)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:44px;height:44px;border-radius:14px;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);position:relative;cursor:pointer;display:grid;place-items:center}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.sw.custom span{color:#fff;font-weight:800;font-size:20px;text-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* Guía */
.tour{position:fixed;inset:0;z-index:70}
.tour-hole{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(4,6,12,.78);transition:all .28s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tour-hole.ring{outline:2px solid var(--hero-gold);outline-offset:3px}
.tour-block{position:fixed;inset:0}
.tour-card{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:20px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.3);display:grid;gap:10px;transition:top .28s,bottom .28s}
.tour-card h3{font-family:var(--f-display);font-size:19px;margin:0;text-wrap:balance}
.tour-card p{margin:0;font-size:14.5px;color:var(--muted)}
.tour-dots{display:flex;gap:5px}
.tour-dots i{width:7px;height:7px;border-radius:9px;background:var(--line)}
.tour-dots i.on{width:20px;background:var(--brand)}
.tour-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.tour-logo{font-family:var(--f-display);font-weight:800;font-size:26px}
.tour-logo b{color:var(--gold)}
@media (prefers-reduced-motion: reduce){.tour-hole,.tour-card{transition:none}}

/* Más menu */
.menu{display:grid}
.menu-i{display:flex;align-items:center;gap:14px;padding:14px;border-top:1px solid var(--line);text-align:left;width:100%}
.menu-i:first-child{border-top:0}
.menu-i .mi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.menu-i .mi svg{width:20px;height:20px}
.menu-i div{flex:1;min-width:0}
.menu-i b{display:block;font-size:15px}
.menu-i small{display:block;color:var(--muted);font-size:12.5px}
.menu-i[disabled]{opacity:.55;cursor:default}
.pill{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:64px;padding-inline:6px}
.tab{display:grid;justify-items:center;gap:2px;padding:8px 0 9px;font-size:11px;font-weight:700;color:var(--faint)}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--brand)}
.fab{justify-self:center;align-self:center;width:58px;height:58px;border-radius:20px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;transform:translateY(-14px);box-shadow:0 6px 18px rgba(37,51,111,.35)}
.fab svg{width:28px;height:28px}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(8,10,18,.48);animation:fade .18s ease-out}
.sheet{position:relative;width:100%;max-width:480px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-family:var(--f-display);font-size:19px;margin:0 0 14px}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:10px 0 4px}
.amount span{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--muted)}
.amount input{width:2ch;min-width:2ch;max-width:calc(100% - 40px);border:0;background:none;font-family:var(--f-display);font-size:42px;font-weight:700;text-align:center;padding:0;font-variant-numeric:tabular-nums}
.amount input:focus{outline:none}
.amount.neg input{color:var(--neg)} .amount.pos input{color:var(--pos)}
.form{display:grid;gap:14px}
.err{color:var(--neg);font-size:13px;font-weight:700;min-height:1em}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet,.scrim{animation:none}}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
</style>

<script>

const ACCT_COLORS=['#2C4596','#0E6E62','#A0561A','#6E3584','#3D5563','#9B3354','#4F5E17','#1F5E8C'];

};

/* ============ estado ============ */
const KEY='organizado.v1', UIKEY='organizado.ui';
let storageOK=true;
function load(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null}catch(e){storageOK=false;return null}}
let S=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}}
function save(){D=null;persist()}
let D=null;
function nextId(){S.seq=(S.seq||0)+1;return S.seq}

function blank(){
  const cats=[['Comida','gasto','NECESIDAD'],['Comida afuera','gasto','LUJO'],['Domicilio','gasto','LUJO'],['Café','gasto','LUJO'],['Mecato','gasto','LUJO'],['Transporte','gasto','NECESIDAD'],['Servicios','gasto','NECESIDAD'],['Alquiler','gasto','NECESIDAD'],['Medicina','gasto','NECESIDAD'],['Educación','gasto','NECESIDAD'],['Gimnasio','gasto',null],['Entretenimiento','gasto','LUJO'],['Articulos','gasto',null],['Aseo Personal','gasto','NECESIDAD'],['Mascota','gasto','NECESIDAD'],['Obsequio','gasto','LUJO'],['Inversión','gasto',null],['Pago','gasto',null],['Prestamo','ambos',null],['Sueldo','ingreso',null],['Cobro','ingreso',null],['Ingreso extra','ingreso',null],['Traspaso','sistema',null],['Balance','sistema',null]];
  return{v:1,demo:false,seq:0,cuentas:[{nombre:'Banco',color:ACCT_COLORS[0]},{nombre:'Billetera digital',color:ACCT_COLORS[1]},{nombre:'Efectivo',color:ACCT_COLORS[2]}],cats:cats.map(([nombre,tipo,realidad])=>({nombre,tipo,realidad})),movs:[],ppto:{},deudas:[],activos:[],pat:{invCosto:false,meta:0},nomina:null,perfil:perfilDefault()};
}

/* datos de ejemplo (deterministas) */
function demo(){
  const s=blank();s.demo=true;s.cuentas=[{nombre:'Banco',color:ACCT_COLORS[0]},{nombre:'Billetera digital',color:ACCT_COLORS[1]},{nombre:'Efectivo',color:ACCT_COLORS[2]}];
  let seed=7;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const pick=a=>a[Math.floor(rnd()*a.length)];const amt=(a,b,step=500)=>Math.round((a+rnd()*(b-a))/step)*step;
  const t=today();const start=addMonth(curMonth(),-4)+'-01';let id=0;const M=[];
  const add=(f,m,c,cat,con,r)=>{if(f<=t)M.push({id:++id,f,m,c,cat,con,r:r||null})};
  add(start,2400000,'Banco','Balance','Saldo inicial');add(start,180000,'Billetera digital','Balance','Saldo inicial');add(start,90000,'Efectivo','Balance','Saldo inicial');
  for(let f=start;f<=t;f=addDays(f,1)){
    const d=new Date(f+'T12:00'),dd=d.getDate(),dow=d.getDay(),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    if(dd===15||dd===last)add(f,1700000,'Banco','Sueldo','Quincena');
    if(dd===5)add(f,-900000,'Banco','Alquiler','Arriendo apartamento','NECESIDAD');
    if(dd===9)add(f,-amt(150000,210000,10),'Banco','Servicios','Energía','NECESIDAD');
    if(dd===11)add(f,-67900,'Banco','Servicios','Internet hogar','NECESIDAD');
    if(dd===3)add(f,-89000,'Banco','Gimnasio','Mensualidad gimnasio');
    if(dd===20)add(f,-300000,'Banco','Inversión','Aporte fondo de inversión');
    if(dd===14)add(f,-33900,'Billetera digital','Entretenimiento','Suscripción streaming','LUJO');
    if(dow===1){add(f,-200000,'Banco','Traspaso','Banco a Billetera digital');add(f,200000,'Billetera digital','Traspaso','Banco a Billetera digital')}
    if(dd===1||dd===16){add(f,-100000,'Banco','Traspaso','Retiro a efectivo');add(f,100000,'Efectivo','Traspaso','Retiro a efectivo')}
    if(dow===6)add(f,-amt(110000,175000,100),'Billetera digital','Comida','Mercado semanal','NECESIDAD');
    if(rnd()<.38)add(f,-amt(12000,32000),pick(['Billetera digital','Efectivo']),'Comida afuera',pick(['Almuerzo','Corrientazo','Arepa y jugo','Hamburguesa','Empanadas']),'LUJO');
    if(rnd()<.45)add(f,-amt(2000,6500,100),'Efectivo','Café',pick(['Tinto','Café con leche','Capuchino']),'LUJO');
    if(dow>0&&dow<6&&rnd()<.6)add(f,-2950*2,'Billetera digital','Transporte','Bus ida y vuelta','NECESIDAD');
    if(rnd()<.12)add(f,-amt(18000,42000),'Billetera digital','Domicilio',pick(['Pizza','Sushi','Pollo asado']),'LUJO');
    if(rnd()<.14)add(f,-amt(3000,9000,100),'Efectivo','Mecato',pick(['Paquete de papas','Gaseosa','Chocolatina']),'LUJO');
    if(rnd()<.05)add(f,-amt(25000,90000,1000),'Banco','Articulos',pick(['Cable USB','Audífonos','Libreta','Bombillo LED']));
    if(rnd()<.04)add(f,-amt(15000,60000,1000),'Billetera digital','Obsequio',pick(['Detalle cumpleaños','Flores','Invitación a almorzar']),'LUJO');
    if(rnd()<.03)add(f,-amt(12000,48000,100),'Banco','Medicina',pick(['Droguería','Vitaminas']),'NECESIDAD');

  s.pat={invCosto:false,meta:20000000};

}
if(!S||!Array.isArray(S.movs)){S=demo()}

if(!Array.isArray(S.activos))S.activos=[];if(!S.perfil)S.perfil=perfilDefault();if(!S.pat)S.pat={invCosto:false,meta:0};

/* ============ derivados ============ */
function der(){
  if(D)return D;
  const movs=[...S.movs].sort((a,b)=>a.f<b.f?1:a.f>b.f?-1:b.id-a.id);
  const saldo={};S.cuentas.forEach(c=>saldo[c.nombre]=0);let total=0;
  const byMonth={},catUse={};
  for(const x of movs){saldo[x.c]=(saldo[x.c]||0)+x.m;total+=x.m;(byMonth[x.f.slice(0,7)]||=[]).push(x)}
  const recent=movs.slice(0,600);
  for(const x of recent){const k=x.cat+(x.m<0?'|-':'|+');catUse[k]=(catUse[k]||0)+1}
  const first=movs.length?movs[movs.length-1].f:today(),lastF=movs.length?movs[0].f:today();
  D={movs,saldo,total,byMonth,catUse,first,last:lastF};return D;
}
function monthStats(k){
  const r={ing:0,egr:0,lujo:0,nec:0,sin:0,n:0};
  for(const x of der().byMonth[k]||[]){if(!isFlow(x))continue;r.n++;if(x.m>0)r.ing+=x.m;else{r.egr-=x.m;if(x.r==='LUJO')r.lujo-=x.m;else if(x.r==='NECESIDAD')r.nec-=x.m;else r.sin-=x.m}}
  return r;
}
function spendByCat(movs){const o={};for(const x of movs)if(isFlow(x)&&x.m<0)o[x.cat]=(o[x.cat]||0)-x.m;return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function catOf(n){return S.cats.find(c=>c.nombre===n)}
function findCat(n){const k=norm(n);return S.cats.find(c=>norm(c.nombre)===k)}
function ensureCat(n,tipo){let c=findCat(n);if(!c){c={nombre:n,tipo,realidad:null};S.cats.push(c)}return c.nombre}
function allMonths(){const d=der();const out=[];let k=d.first.slice(0,7);const end=(d.last>today()?d.last:today()).slice(0,7);while(k<=end){out.push(k);k=addMonth(k,1)}return out}
function balanceSeries(from,to){
  const d=der();const asc=[...d.movs].reverse();let bal=0,i=0;
  while(i<asc.length&&asc[i].f<from){bal+=asc[i].m;i++}
  const pts=[];const span=Math.round((new Date(to)-new Date(from))/864e5);const step=span>400?7:span>150?2:1;
  for(let f=from;f<=to;f=addDays(f,1)){while(i<asc.length&&asc[i].f<=f){bal+=asc[i].m;i++}
    const dd=Math.round((new Date(f)-new Date(from))/864e5);if(dd%step===0||f===to)pts.push([f,bal])}
  return pts;
}
function deudaSaldo(x){return x.monto-(x.abonos||[]).reduce((a,b)=>a+b.m,0)}
const daysTo=f=>Math.round((new Date(f+'T12:00')-new Date(today()+'T12:00'))/864e5);
function dueInfo(x){
  if(!x.prox||deudaSaldo(x)<=0)return null;const n=daysTo(x.prox);
  const cls=n<0?'over':n<=3?'warn':'ok';
  const txt=n<0?`Vencido hace ${-n} día${n===-1?'':'s'}`:n===0?'Vence hoy':n===1?'Vence mañana':`Vence en ${n} días`;
  return{n,cls,txt,icon:n<0?'▲':n<=3?'●':'○'};
}
function alertas(){return S.deudas.map(x=>({x,d:dueInfo(x)})).filter(a=>a.d&&a.d.n<=7).sort((a,b)=>a.d.n-b.d.n)}
function alertaTxt(a){return a.x.tipo==='debo'?`Pagar a ${a.x.persona}`:`${a.x.persona} debe pagarte`}

function mkChart(id,cfg){
  const el=document.getElementById(id);if(!el)return;
  if(!window.Chart){el.parentElement.innerHTML='<div class="nochart">No se pudieron cargar los gráficos. Revisa tu conexión.</div>';return}
  Chart.defaults.font.family=tok('--f-body')||'system-ui';Chart.defaults.font.size=11;Chart.defaults.color=tok('--muted');Chart.defaults.borderColor=tok('--grid');
  const c=new Chart(el,cfg);charts.push(c);return c;
}

function tipStyle(){return{backgroundColor:tok('--ink'),titleColor:tok('--bg'),bodyColor:tok('--bg'),padding:10,cornerRadius:10,displayColors:true,boxPadding:4}}
function axisY(){return{grid:{color:tok('--grid')},border:{display:false},ticks:{callback:v=>fmtC(v),maxTicksLimit:5}}}

}
function monthNav(key,act,max){return`<div class="monthnav"><button class="iconbtn" data-act="${act}" data-d="-1" aria-label="Mes anterior">${ICON.prev}</button><b>${monthLabel(key)}</b><button class="iconbtn" data-act="${act}" data-d="1" aria-label="Mes siguiente" ${max&&key>=max?'disabled':''}>${ICON.next}</button></div>`}
function alertRow(a){const s=deudaSaldo(a.x);return`<button class="alert-row" data-act="verDeuda" data-id="${a.x.id}"><span class="status ${a.d.cls}">${a.d.icon} ${a.d.txt}</span><span class="alert-main"><b>${esc(alertaTxt(a))}</b><small>${dayLabel(a.x.prox)} ${a.x.prox.slice(0,4)}</small></span><span class="num ${a.x.tipo==='debo'?'neg':'pos'}" style="font-weight:800">${fmtC(s)}</span></button>`}
function pStatus(p){return p>1?['over','Excedido']:p>=.8?['warn','Cerca del límite']:['ok','Bien']}
function pctTxt(p){return Math.round(p*100)+'%'}

/* ============ patrimonio neto ============ */
function activoValor(a,D){
  if(!a||D<a.f)return 0;
  if(a.tipo==='bien'){const vida=+a.vida||0;if(!vida)return +a.compra||0;const yrs=(new Date(D)-new Date(a.f))/(365.25*864e5);return Math.max(0,(+a.compra||0)*(1-yrs/vida))}
  let v=0;for(const h of a.hist||[])if(h.f<=D)v=h.v;return v;
}
function patSeries(){
  const d=der();if(d.pat)return d.pat;
  const asc=[...d.movs].reverse(),from=d.movs.length?d.first:today(),to=today()>d.last?today():d.last;
  const inc=!!S.pat.invCosto,acts=S.activos||[];acts.forEach(a=>{if(a.hist)a.hist.sort((x,y)=>x.f.localeCompare(y.f))});
  let first=from;acts.forEach(a=>{if(a.f<first)first=a.f});S.deudas.forEach(x=>{if(x.f<first)first=x.f});
  let cash=0,inv=0,i=0;const out=[];
  for(let f=first;f<=to;f=addDays(f,1)){
    while(i<asc.length&&asc[i].f<=f){const x=asc[i];cash+=x.m;if(norm(x.cat)==='inversion')inv-=x.m;i++}
    let cob=0,deb=0;for(const x of S.deudas){if(f<x.f)continue;const s=Math.max(0,x.monto-(x.abonos||[]).reduce((a,b)=>b.f<=f?a+b.m:a,0));if(x.tipo==='me_deben')cob+=s;else deb+=s}
    let act=0;for(const a of acts)act+=activoValor(a,f);
    const invC=inc?Math.max(0,inv):0;
    out.push({f,cash,inv:invC,act,cob,deb,total:cash+invC+act+cob-deb});
  }
  d.pat=out;return out;
}
const pctS=(a,b)=>b?((a/Math.abs(b))*100).toLocaleString('es-CO',{maximumFractionDigits:2,signDisplay:'always'})+'%':'—';
const sgn=n=>(n>0?'+':'')+fmt(n);

  ['hen','Hora extra nocturna','Fuera de tu jornada, entre 7 p. m. y 6 a. m.',L=>175,false],
  ['rn','Recargo nocturno','Horas de tu jornada normal entre 7 p. m. y 6 a. m.',L=>35,true],
  ['rdf','Recargo dominical o festivo','Horas de tu jornada en domingo o festivo',L=>L.dom,true],
  ['rndf','Recargo nocturno dominical o festivo','Jornada de noche en domingo o festivo',L=>L.dom+35,true],

function parseRegistro(X,wb){
  const nk=v=>String(v??'').normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toLowerCase();
  const p2=n=>String(n).padStart(2,'0');
  let rows=null,H=null,sheet=null;
  const names=[...wb.SheetNames].sort((a,b)=>(nk(b)==='registro')-(nk(a)==='registro'));
  for(const n of names){
    const r=X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,blankrows:false,defval:null});
    for(let i=0;i<Math.min(r.length,15);i++){const h=(r[i]||[]).map(nk);if(h.includes('fecha')&&h.includes('cantidad')){rows=r.slice(i+1);H=h;sheet=n;break}}
    if(rows)break;
  }
  if(!rows)throw new Error('No encontré una hoja con las columnas FECHA y CANTIDAD.');
  const iF=H.indexOf('fecha'),iM=H.indexOf('cantidad'),iCat=H.indexOf('categoria'),iCon=H.indexOf('concepto'),iR=H.indexOf('realidad');
  let iC=H.indexOf('salio de');if(iC<0)iC=H.indexOf('cuenta');
  const toISO=v=>{
    if(typeof v==='number'&&v>20000&&v<80000){const d=X.SSF.parse_date_code(v);return`${d.y}-${p2(d.m)}-${p2(d.d)}`}
    if(v instanceof Date&&!isNaN(v))return`${v.getFullYear()}-${p2(v.getMonth()+1)}-${p2(v.getDate())}`;
    if(typeof v==='string'){let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return`${m[1]}-${p2(m[2])}-${p2(m[3])}`;m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m)return`${m[3]}-${p2(m[2])}-${p2(m[1])}`}
    return null};
  const toNum=v=>{if(typeof v==='number')return v;if(typeof v==='string'){const t=v.replace(/[^\d,.-]/g,'');const n=Number(t.includes(',')?t.replace(/\./g,'').replace(',','.'):t);return isFinite(n)?n:NaN}return NaN};
  const acctForms={},catForms={};
  const raw=[];let skipped=0;
  for(const r of rows){
    const f=toISO(r[iF]),m=toNum(r[iM]);
    if(!f||!isFinite(m)||m===0){if(r[iF]!=null||r[iM]!=null)skipped++;continue}
    const c0=String(r[iC]??'').trim()||'Sin cuenta',cat0=String(r[iCat]??'').trim()||'Sin categoría';
    const ck=nk(c0),kk=nk(cat0);
    (acctForms[ck]||={})[c0]=(acctForms[ck][c0]||0)+1;(catForms[kk]||={})[cat0]=(catForms[kk][cat0]||0)+1;
    const rr=nk(r[iR]);
    raw.push({f,m:Math.round(m*100)/100,ck,kk,con:String(r[iCon]??'').trim(),r:rr==='lujo'?'LUJO':rr==='necesidad'?'NECESIDAD':null});
  }
  if(!raw.length)throw new Error('La hoja '+sheet+' no tiene movimientos válidos.');
  const best=o=>{const e=Object.entries(o).sort((a,b)=>b[1]-a[1]||(/^[A-ZÁÉÍÓÚÑ]/.test(b[0])-/^[A-ZÁÉÍÓÚÑ]/.test(a[0])));let s=e[0][0];return s.charAt(0).toUpperCase()+s.slice(1)};
  const acctName={},catName={};for(const k in acctForms)acctName[k]=best(acctForms[k]);for(const k in catForms)catName[k]=best(catForms[k]);
  const movs=raw.map((x,i)=>({id:i+1,f:x.f,m:x.m,c:acctName[x.ck],cat:catName[x.kk],con:x.con,r:x.r}));
  const st={};
  for(const x of movs){const s=st[x.cat]||={n:0,pos:0,neg:0,lujo:0,nec:0};s.n++;if(x.m>0)s.pos++;else s.neg++;if(x.r==='LUJO')s.lujo++;if(x.r==='NECESIDAD')s.nec++}
  const cats=Object.entries(st).sort((a,b)=>b[1].n-a[1].n).map(([nombre,s])=>{
    const k=nk(nombre);let tipo=k==='traspaso'||k==='balance'?'sistema':s.pos/s.n>=.8?'ingreso':s.neg/s.n>=.8?'gasto':'ambos';
    const tg=s.lujo+s.nec;let realidad=null;if(tg>=3){if(s.lujo/tg>=.7)realidad='LUJO';else if(s.nec/tg>=.7)realidad='NECESIDAD'}
    return{nombre:k==='traspaso'?'Traspaso':k==='balance'?'Balance':nombre,tipo,realidad}});
  movs.forEach(x=>{const k=nk(x.cat);if(k==='traspaso')x.cat='Traspaso';else if(k==='balance')x.cat='Balance'});
  const ac={};movs.forEach(x=>ac[x.c]=(ac[x.c]||0)+1);
  const cuentas=Object.entries(ac).sort((a,b)=>b[1]-a[1]).map(([nombre],i)=>({nombre,color:['#2C4596','#0E6E62','#A0561A','#6E3584','#3D5563','#9B3354','#4F5E17','#1F5E8C'][i%8]}));
  const fs=movs.map(x=>x.f).sort();
  return{sheet,movs,cuentas,cats,skipped,desde:fs[0],hasta:fs[fs.length-1]};
}

      for(const n of ['Traspaso','Balance'])if(!findCat(n))S.cats.push({nombre:n,tipo:'sistema',realidad:null});
      save();closeSheet();toast(r.movs.length.toLocaleString('es-CO')+' movimientos importados');go('inicio')}});
}

    <p class="err" id="p-err"></p><button class="btn block" id="p-ok">Guardar</button>${cat?'<button class="btn block ghost" id="p-del" style="color:var(--neg)">Quitar del presupuesto</button>':''}</div>`,()=>{

function autoPpto(){
  const k=curMonth(),ms=[addMonth(k,-3),addMonth(k,-2),addMonth(k,-1)];const tot={};
  ms.forEach(m=>(der().byMonth[m]||[]).forEach(x=>{if(isFlow(x)&&x.m<0)tot[x.cat]=(tot[x.cat]||0)-x.m}));
  const sug=Object.entries(tot).map(([c,v])=>[c,Math.ceil(v/3/10000)*10000]).filter(([,v])=>v>=20000).sort((a,b)=>b[1]-a[1]);
  if(!sug.length){toast('No hay suficientes gastos en los últimos 3 meses');return}
  confirmSheet('Presupuesto con tu promedio',`Se pondrá como límite el promedio de ${monthLabel(ms[0])} a ${monthLabel(ms[2])}, redondeado a $10.000, en ${sug.length} categorías:<br><br>${sug.slice(0,8).map(([c,v])=>`${esc(c)}: <b>${fmt(v)}</b>`).join('<br>')}${sug.length>8?'<br>…':''}`,'Aplicar',()=>{sug.forEach(([c,v])=>S.ppto[c]=v);save();render();toast('Presupuesto actualizado')});
}

const EMOJIS=['👋','😄','🚀','💪','🌞','✨','🤑','💸','🎯','🔥','🌱','😎','🙌','💰','🍀','⭐','🦾','🎉','🌈','☕','🧠','🏆','🌻','🥳'];
const EMO=EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
const HERO_THEMES={indigo:['Índigo','#1D285A','#33448F'],oceano:['Océano','#0B3550','#1A6E92'],esmeralda:['Esmeralda','#0B3B33','#14715F'],ciruela:['Ciruela','#2E1747','#5E3591'],vino:['Vino','#4A1426','#8A2B47'],atardecer:['Atardecer','#5A1E14','#B5542A'],grafito:['Grafito','#1C1F26','#3E4452']};
function perfilDefault(){return{nombre:'',tema:'indigo',color:null,img:null,osc:45}}
function mixHex(h,t,k){const n=parseInt(h.slice(1),16),a=[n>>16&255,n>>8&255,n&255],b=t==='#000'?[0,0,0]:[255,255,255];return'#'+a.map((v,i)=>Math.round(v+(b[i]-v)*k).toString(16).padStart(2,'0')).join('')}
function lum(h){const n=parseInt(h.slice(1),16);return(0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255}
function heroColors(){const pf=S.perfil;if(pf.tema==='custom'&&pf.color){const L=lum(pf.color);return[mixHex(pf.color,'#000',L>.55?.62:.45),mixHex(pf.color,'#000',L>.55?.32:.08)]}const t=HERO_THEMES[pf.tema]||HERO_THEMES.indigo;return[t[1],t[2]]}
function heroStyle(){const pf=S.perfil,[a,b]=heroColors();let st=`--hero-a:${a};--hero-b:${b};`;if(pf.img){const o=(pf.osc/100).toFixed(2);st+=`background-image:linear-gradient(rgba(0,0,0,${o}),rgba(0,0,0,${o})),url(${pf.img});background-size:cover;background-position:center;`}return st}
function saludo(){const h=new Date().getHours();return h>=5&&h<12?'Buenos días':h>=12&&h<19?'Buenas tardes':'Buenas noches'}
function fechaLarga(){const d=new Date();return`${['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`}
function helloHTML(){const n=(S.perfil.nombre||'').trim();return`<div class="hello"><h1>Hola${n?', '+esc(n):''} <span class="emo" aria-hidden="true">${EMO}</span></h1><p>${saludo()} · ${fechaLarga()}</p></div>`}
function heroPreview(){const d=der();return`<section class="hero hero-main${S.perfil.img?' has-img':''}" style="${heroStyle()}" aria-label="Vista previa de la tarjeta"><div class="hero-top"><span class="eyebrow">Saldo total</span><span class="hero-month">${monthLabel(curMonth())}</span></div><div class="hero-num num">${fmt(d.total)}</div><div class="hero-flow" style="margin-top:14px"><div><span>Entró</span><b>+${fmtC(monthStats(curMonth()).ing)}</b></div><div><span>Salió</span><b>−${fmtC(monthStats(curMonth()).egr)}</b></div><div><span>Vista previa</span><b>✓</b></div></div></section>`}
V.perfil={html(){const pf=S.perfil;
  return`<div class="card"><label class="field"><span>Tu nombre o alias</span><input class="inp" id="pf-n" value="${esc(pf.nombre)}" maxlength="24" placeholder="Ej. Fredy" autocomplete="given-name"></label><p class="small muted" style="margin:8px 0 0">Aparece en el saludo de la cartera, con un emoji distinto cada vez que abres la app.</p></div>
  <div class="sec-h"><h2>Tarjeta de inicio</h2></div>
  <div id="pf-prev">${heroPreview()}</div>
  <div class="card" style="margin-top:12px"><div class="form">
    <div class="field"><span>Color</span><div class="swatches">${Object.entries(HERO_THEMES).map(([k,[l,a,b]])=>`<button class="sw" data-act="pfTema" data-k="${k}" aria-pressed="${pf.tema===k}" aria-label="${l}" title="${l}" style="background:linear-gradient(135deg,${a},${b})"></button>`).join('')}<label class="sw custom" aria-pressed="${pf.tema==='custom'}" title="Elegir otro color" style="background:${pf.color||'conic-gradient(#e34948,#eda100,#1baf7a,#2a78d6,#9085e9,#e34948)'}"><input type="color" id="pf-c" value="${pf.color||'#2a78d6'}" aria-label="Elegir otro color"><span>+</span></label></div></div>
    <div class="field"><span>Imagen de fondo</span><div class="row2"><label class="btn ghost" for="pf-img">${pf.img?'Cambiar imagen':'Elegir imagen'}</label>${pf.img?'<button class="btn ghost" data-act="pfNoImg" style="color:var(--neg)">Quitar imagen</button>':'<span></span>'}</div><input type="file" id="pf-img" accept="image/*" hidden><p class="err" id="pf-err" style="margin:0"></p></div>
    ${pf.img?`<label class="field"><span>Oscurecer la imagen para leer mejor: <b id="pf-ov">${pf.osc}%</b></span><input type="range" id="pf-o" min="0" max="80" step="5" value="${pf.osc}" style="width:100%;accent-color:var(--brand)"></label>`:''}
    <p class="small muted" style="margin:0">La imagen se guarda reducida dentro de la app, en este dispositivo, y viaja en tus respaldos.</p>
  </div></div>`},
mount(){const pf=S.perfil;
  $('#pf-n').addEventListener('input',e=>{pf.nombre=e.target.value.slice(0,24);persist()});
  const prev=()=>{$('#pf-prev').innerHTML=heroPreview()};
  const c=$('#pf-c');c.addEventListener('input',()=>{pf.color=c.value;pf.tema='custom';persist();prev();c.parentElement.style.background=c.value;$$('.sw').forEach(s=>s.setAttribute('aria-pressed',s===c.parentElement))});
  const o=$('#pf-o');if(o)o.addEventListener('input',()=>{pf.osc=+o.value;$('#pf-ov').textContent=o.value+'%';persist();prev()});
  $('#pf-img').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;$('#pf-err').textContent='Procesando imagen…';
    try{pf.img=await shrinkImage(f);persist();$('#pf-err').textContent='';render();toast('Imagen aplicada')}catch(err){$('#pf-err').textContent='No pude abrir esa imagen. Prueba con una foto JPG o PNG.'}};
}};
function shrinkImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{try{const max=1280,k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    let q=.82,d=cv.toDataURL('image/jpeg',q);while(d.length>700000&&q>.4){q-=.12;d=cv.toDataURL('image/jpeg',q)}URL.revokeObjectURL(url);res(d)}catch(e){rej(e)}};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};im.src=url})}
function askNameOnOpen(next){
  let asked=false;try{asked=localStorage.getItem('organizado.askname')==='1'}catch(e){}
  if(S.perfil.nombre||asked){next();return}
  try{localStorage.setItem('organizado.askname','1')}catch(e){}
  openSheet(`<h3>¿Cómo te llamamos? <span aria-hidden="true">${EMO}</span></h3><div class="form"><label class="field"><span>Tu nombre o alias</span><input class="inp" id="an-n" maxlength="24" placeholder="Ej. Fredy" autocomplete="given-name"></label>
    <button class="btn block" id="an-ok">Guardar</button><button class="btn block ghost" id="an-no">Ahora no</button></div>`,()=>{
    setTimeout(()=>$('#an-n')&&$('#an-n').focus(),250);
    const done=()=>{closeSheet();render();next()};
    $('#an-ok').onclick=()=>{S.perfil.nombre=$('#an-n').value.trim().slice(0,24);persist();done()};
    $('#an-n').onkeydown=e=>{if(e.key==='Enter')$('#an-ok').click()};
    $('#an-no').onclick=done});
}

/* ============ guía de uso ============ */
const TOUR=[
  {t:'Bienvenido a <span class="tour-logo" style="font-size:inherit">ORGANIZADO<b>$</b></span>',p:'Tu billetera para saber en qué se va la plata. Te mostramos lo básico en 6 pasos; toma menos de un minuto.<br><br>Tus datos se guardan solo en este dispositivo. Nadie más los ve, ni siquiera quien te compartió el link.',name:true},
  {sel:'.fab',t:'Registra en segundos',p:'Toca + para anotar un gasto, un ingreso o un traspaso entre cuentas. Escribe el monto, elige la categoría, la cuenta, y guarda.'},
  {sel:'.hero',view:'inicio',t:'Tu cartera',p:'Aquí ves cuánto tienes en total, cómo ha cambiado en los últimos 90 días y cuánto entró y salió este mes. Debajo están tus cuentas: toca una para ver sus movimientos.'},
  {sel:'.tab[data-tab=movs]',t:'Movimientos',p:'Todo lo que registras, día por día. Busca, filtra por cuenta o categoría y toca cualquier movimiento para corregirlo o borrarlo.'},
  {sel:'.tab[data-tab=analisis]',t:'Análisis',p:'Gráficos de en qué gastas, ingresos contra gastos, lujo contra necesidad y qué día gastas más. Cambia entre mes, 3 meses, 12 meses o todo.'},
  {sel:'.tab[data-tab=mas]',t:'Más herramientas',p:'Patrimonio neto, calculadora de nómina, presupuesto con alertas, deudas con recordatorios de pago, tus cuentas y categorías.'},
  {t:'¿Por dónde empiezas?',p:'',last:true}];
let tourI=0,tourOn=false;
function tourSeen(){try{return localStorage.getItem('organizado.tour')==='1'}catch(e){return false}}
function startTour(){closeSheet();tourOn=true;tourI=0;if(UI.view!=='inicio')go('inicio');$('#tour').hidden=false;document.body.style.overflow='hidden';drawTour()}
function endTour(after){tourOn=false;$('#tour').hidden=true;document.body.style.overflow='';try{localStorage.setItem('organizado.tour','1')}catch(e){}if(after)after();else showAlertsOnOpen()}
function drawTour(){
  const st=TOUR[tourI],hole=$('#tour-hole'),card=$('#tour-card');
  if(st.view&&UI.view!==st.view)go(st.view);
  let el=st.sel?$(st.sel):null;
  if(el){el.scrollIntoView({block:'center',behavior:'instant'});}
  const dots=`<div class="tour-dots" aria-hidden="true">${TOUR.map((_,i)=>`<i class="${i===tourI?'on':''}"></i>`).join('')}</div>`;
  let body;
  if(st.last){
    body=S.demo?`<p>Elige cómo quieres arrancar. Puedes cambiar de opinión después desde <b>Más › Importar y respaldos</b>.</p>
      <div class="stack" style="gap:8px;margin-top:4px"><button class="btn block" data-tour="excel">Importar mi Excel</button><button class="btn block ghost" data-tour="blank">Empezar en blanco</button><button class="btn block ghost" data-tour="demo">Seguir viendo el ejemplo</button></div>
      <p class="small">Consejo: descarga un respaldo cada semana. Si borras los datos del navegador o cambias de celular, es la única forma de recuperarlos.</p>`
      :`<p>Ya tienes tus datos cargados. Recuerda descargar un respaldo cada semana desde <b>Más › Importar y respaldos</b>.</p><div class="tour-row"><span></span><button class="btn" data-tour="done">Listo</button></div>`;
  }else body=`<p>${st.p}</p>${st.name?`<label class="field"><span style="font-size:12.5px;font-weight:700;color:var(--muted)">¿Cómo te llamamos?</span><input class="inp" id="tour-name" maxlength="24" placeholder="Tu nombre o alias" value="${esc(S.perfil.nombre)}" autocomplete="given-name"></label>`:''}<div class="tour-row"><button class="link" data-tour="skip" style="color:var(--muted)">Saltar guía</button><div style="display:flex;gap:8px">${tourI>0?'<button class="btn ghost sm" data-tour="prev">Atrás</button>':''}<button class="btn sm" data-tour="next">${tourI===0?'Empezar':'Siguiente'}</button></div></div>`;
  card.innerHTML=`${dots}<h3 id="tour-t">${st.t}</h3>${body}`;
  card.style.top=card.style.bottom='';
  if(el){const r=el.getBoundingClientRect(),pd=6;
    Object.assign(hole.style,{left:(r.left-pd)+'px',top:(r.top-pd)+'px',width:(r.width+pd*2)+'px',height:(r.height+pd*2)+'px'});hole.classList.add('ring');
    if(r.top+r.height/2>innerHeight/2)card.style.bottom=(innerHeight-r.top+pd+14)+'px';else card.style.top=(r.bottom+pd+14)+'px';
  }else{Object.assign(hole.style,{left:'50%',top:'50%',width:'0px',height:'0px'});hole.classList.remove('ring');card.style.top=Math.max(24,(innerHeight-card.offsetHeight)/2)+'px'}
  const f=$('#tour-name',card)||$('[data-tour=next],[data-tour=excel],[data-tour=done]',card);if(f&&f.id!=='tour-name')f.focus({preventScroll:true});
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tour]');if(!b)return;e.stopPropagation();const a=b.dataset.tour;
  const tn=$('#tour-name');if(tn){S.perfil.nombre=tn.value.trim().slice(0,24);persist();try{localStorage.setItem('organizado.askname','1')}catch(e){}}
  if(a==='next'){tourI=Math.min(TOUR.length-1,tourI+1);render();drawTour()}
  else if(a==='prev'){tourI=Math.max(0,tourI-1);drawTour()}
  else if(a==='skip'||a==='done'||a==='demo')endTour();
  else if(a==='excel')endTour(()=>go('datos'));
  else if(a==='blank')endTour(()=>{const pf=S.perfil;S=blank();S.perfil=pf;save();go('cuentas');toast('Renombra tus cuentas y agrega las que te falten')});
},true);
document.addEventListener('keydown',e=>{if(!tourOn)return;if(e.key==='Escape')endTour();else if(e.target&&e.target.tagName==='INPUT'){if(e.key==='Enter'){const nb=$('[data-tour=next]');if(nb)nb.click()}return}else if(e.key==='ArrowRight'&&!TOUR[tourI].last){tourI++;drawTour()}else if(e.key==='ArrowLeft'&&tourI>0){tourI--;drawTour()}});
addEventListener('resize',()=>{if(tourOn)drawTour()});

/* ============ aviso al abrir ============ */
function showAlertsOnOpen(){
  const al=alertas();if(!al.length)return;
  let last=null;try{last=localStorage.getItem('organizado.aviso')}catch(e){}
  const sig=today()+':'+al.map(a=>a.x.id+'@'+a.x.prox).join(',');if(last===sig)return;
  try{localStorage.setItem('organizado.aviso',sig)}catch(e){}
  const venc=al.filter(a=>a.d.n<0).length;
  openSheet(`<h3>Recordatorio de pagos</h3><p class="small muted" style="margin:-6px 0 12px">${venc?`${venc} vencido${venc>1?'s':''}. `:''}Estos pagos vencen en los próximos 7 días o ya se pasaron.</p>
    <div class="card" style="padding:4px 16px">${al.map(alertRow).join('')}</div>
    <div class="stack" style="margin-top:14px"><button class="btn block" data-act="closeSheet">Entendido</button></div>`);
}

/* ============ render ============ */
function renderTop(){
  const sub=TITLES[UI.view];
  const pv=UI.view==='patrimonio'||UI.view==='nomina';
  $('#top').innerHTML=sub?`<button class="back" data-go="mas">${ICON.back}<span>${sub}</span></button>${pv?`<button class="iconbtn" data-act="togglePriv" aria-pressed="${UI.priv}" aria-label="${UI.priv?'Mostrar cifras':'Ocultar cifras'}" title="${UI.priv?'Mostrar cifras':'Ocultar cifras'}">${UI.priv?ICON.eyeOff:ICON.eye}</button>`:''}`:`<div class="logo" aria-label="ORGANIZADO$">ORGANIZADO<b>$</b></div><span class="top-sub">${UI.view==='inicio'?'Mi cartera':UI.view==='movs'?'Movimientos':UI.view==='analisis'?'Análisis':'Más'}</span>`;
}
function renderBanner(){
  let h='';
  if(S.demo)h+=`<div class="banner"><p><b>Estás viendo datos de ejemplo.</b> Importa tu Excel o empieza en blanco para usar tus propias cuentas.</p><div class="row"><button class="btn sm" data-go="datos">Importar mi Excel</button><button class="btn sm ghost" data-act="startBlank">Empezar en blanco</button></div></div>`;
  if(!storageOK)h+=`<div class="banner warn"><p><b>Este navegador no está guardando tus cambios.</b> Descarga un respaldo desde Más › Importar y respaldos antes de cerrar.</p></div>`;
  $('#banner').innerHTML=(UI.view==='inicio'||UI.view==='datos'||!storageOK)?h:'';
}
function render(){
  destroyCharts();const v=V[UI.view]||V.inicio;if(!V[UI.view])UI.view='inicio';
  renderTop();renderBanner();
  $('#view').classList.toggle('priv',UI.priv&&(UI.view==='patrimonio'||UI.view==='nomina'));
  $('#view').innerHTML=v.html();if(v.mount)v.mount();
  const tab=TITLES[UI.view]?'mas':UI.view;$$('.tab').forEach(t=>t.setAttribute('aria-current',t.dataset.tab===tab?'page':'false'));
  const nA=alertas().length,mt=$('.tab[data-tab=mas]');let dt=$('.dot',mt);if(nA){if(!dt){dt=document.createElement('span');dt.className='dot';mt.appendChild(dt)}dt.textContent=nA;dt.setAttribute('aria-label',nA+' pagos por atender')}else if(dt)dt.remove();
}
(function(){const h=(location.hash||'').slice(1);if(h&&V[h])UI.view=h})();
render();
if(!tourSeen())setTimeout(startTour,700);else askNameOnOpen(showAlertsOnOpen);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render())}catch(e){}
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(charts.length)render()});
</script>
</body>
</html>
